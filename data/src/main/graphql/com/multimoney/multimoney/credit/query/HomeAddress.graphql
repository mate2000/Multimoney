    descripcion
    es_Catalogo_Core
    pk_Identificador_Catalogo
    es_Catalogo_Sucursal
    utiliza_Valor
    valor_Catalogo
    llave_Formulario
    monto_Maximo
    subOpciones {
      pk_Suv_Cat_Opcion_Pregunta_Solicitud_Credito
      tipo_Control
      descripcion
      pk_Identificador_Catalogo
