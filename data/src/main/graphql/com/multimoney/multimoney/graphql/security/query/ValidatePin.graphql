query ValidatePin(
  $idBrand:Int!, $appSource:Short, $pkUser:Long!, $ip:String, $pinSecurity:String!, $telephone:String, $sendValidatePin:String, $flowOrigination: String, $userCreate: String
){
  validatePin(
    validatePinInput: { idBrand: $idBrand, aPPSource: $appSource, pk_User: $pkUser, ip:$ip, pinSecurity: $pinSecurity, telephone: $telephone, sendValidatePin:$sendValidatePin, flowOrigination: $flowOrigination, userCreate:$userCreate }
  ) {
    pk_suv_mtr_usuario
    indicador_bloqueo
    status
    message
    detail
  }
}