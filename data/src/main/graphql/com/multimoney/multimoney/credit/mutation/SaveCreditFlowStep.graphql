mutation SaveCreditFlowInput($user:String!, $idBrand:Int!, $infoQuestion:[questionsDataListInput]!, $idLogUserRequest:Int!, $idUSer:Int!, $currentStep:String! ){
  saveCreditFlowStep(
    saveCreditFlowStepInput: {
      user: $user
      idBrand: $idBrand
      infoQuestion: $infoQuestion
      idLogUserRequest: $idLogUserRequest
      idUser: $idUSer
      currentStep: $currentStep
    }
  ) {
    messageInfo
    status
    result
  }
}
