ext {
    // Global versions:
    compile_sdk_version = 32
    min_sdk_version = 21
    target_sdk_version = 32

    // Vesion code
    version_code = 1
    version_name = "0.0.1"

    // Common dependencies:
    core_ktx_version = "1.7.0"

    common = [
            core_ktlx: "androidx.core:core-ktx:$core_ktx_version",
    ]

    // Activity
    activity_version = "1.4.0"

    activity = [
            compose: "androidx.activity:activity-compose:$activity_version"
    ]

    // Lifecycle
    lifecycle_version = "2.4.1"

    lifecycle = [
            runtime               : "androidx.lifecycle:lifecycle-runtime-ktx:$lifecycle_version",
            compiler              : "androidx.lifecycle:lifecycle-compiler:$lifecycle_version",
            view_model            : "androidx.lifecycle:lifecycle-viewmodel-ktx:$lifecycle_version",
            view_model_compose    : "androidx.lifecycle:lifecycle-viewmodel-compose:$lifecycle_version",
            view_model_saved_state: "androidx.lifecycle:lifecycle-viewmodel-savedstate:$lifecycle_version"
    ]

    // Navigation
    navigation_version = "2.4.1"

    navigation = [
            compose: "androidx.navigation:navigation-compose:${navigation_version}",
            test   : "androidx.navigation:navigation-testing:${navigation_version}"
    ]

    // Compose
    compose_version = "1.1.1"

    compose = [
            ui        : "androidx.compose.ui:ui:$compose_version",
            material  : "androidx.compose.material:material:$compose_version",
            tooling   : "androidx.compose.ui:ui-tooling:$compose_version",
            foundation: "androidx.compose.foundation:foundation:$compose_version",
            livedata  : "androidx.compose.runtime:runtime-livedata:${compose_version}",
            test      : "androidx.compose.ui:ui-test-junit4:$compose_version"
    ]

    // Room
    room_version = "2.4.1"

    room = [
            runtime : "androidx.room:room-runtime:${room_version}",
            compiler: "androidx.room:room-compiler:${room_version}",
            ktx     : "androidx.room:room-ktx:${room_version}",
            testing : "androidx.room:room-testing:${room_version}"
    ]

    // Hilt
    hilt_version = "2.40.5"
    hilt_navigation_version = "1.0.0"

    hilt = [
            plugin    : "com.google.dagger:hilt-android-gradle-plugin:${hilt_version}",
            android   : "com.google.dagger:hilt-android:${hilt_version}",
            compiler  : "com.google.dagger:hilt-android-compiler:${hilt_version}",
            navigation: "androidx.hilt:hilt-navigation-compose:${hilt_navigation_version}"
    ]

    // Coroutines
    coroutines_version = '1.3.9'

    coroutines = [
            android: "org.jetbrains.kotlinx:kotlinx-coroutines-android:${coroutines_version}"
    ]

    // Apollo
    apollo_version = '3.1.0'

    apollo = [
            runtime     : "com.apollographql.apollo3:apollo-runtime:${apollo_version}",
            cache       : "com.apollographql.apollo3:apollo-normalized-cache:${apollo_version}",
            cache_sqlite: "com.apollographql.apollo3:apollo-normalized-cache-sqlite:${apollo_version}"
    ]

    // OkHttp3
    okhttp3_version = '4.9.3'

    okhttp3 = [
            interceptor: "com.squareup.okhttp3:logging-interceptor:${okhttp3_version}"
    ]

    // Preferences
    data_store_version = "1.0.0"

    preferences = [
            data_store: "androidx.datastore:datastore-preferences:${data_store_version}"
    ]

    // Sentry
    sentry_version = "5.6.1"

    sentry = [
            android: "io.sentry:sentry-android:${sentry_version}"
    ]

    // Chart
    mp_android_chart_version = "v3.1.0"

    chart = [
            mp_android_chart: "com.github.PhilJay:MPAndroidChart:${mp_android_chart_version}"
    ]

    // Google Services
    google_services_version = "4.3.10"
    google_services_ads_version = "17.0.1"

    google_services = [
            plugin: "com.google.gms:google-services:${google_services_version}",
            ads   : "com.google.android.gms:play-services-ads-identifier:${google_services_ads_version}"
    ]

    // Firebase
    firebase_version = "29.1.0"
    firebase_instalations_version = "17.0.0"
    firebase_perf_classpath_version = "1.4.1"
    firebase_crashlytics_classpath_version = "2.8.1"

    firebase = [
            bom                  : "com.google.firebase:firebase-bom:${firebase_version}",
            config               : "com.google.firebase:firebase-config-ktx",
            perf                 : "com.google.firebase:firebase-perf-ktx",
            perf_classpath       : "com.google.firebase:perf-plugin:${firebase_perf_classpath_version}",
            dynamic_links        : "com.google.firebase:firebase-dynamic-links-ktx",
            messaging            : "com.google.firebase:firebase-messaging-ktx",
            crashlytics          : "com.google.firebase:firebase-crashlytics-ktx",
            crashlytics_classpath: "com.google.firebase:firebase-crashlytics-gradle:${firebase_crashlytics_classpath_version}",
            analytics            : "com.google.firebase:firebase-analytics-ktx",
            installations        : "com.google.firebase:firebase-installations:${firebase_instalations_version}"
    ]

    // Timber
    timber_version = "5.0.1"

    timber = [
            timber: "com.jakewharton.timber:timber:${timber_version}"
    ]

    // OnFido
    onfido_version = "11.3.0"

    onfido = [
            capture: "com.onfido.sdk.capture:onfido-capture-sdk:${onfido_version}"
    ]

    // Adjust
    adjust_version = "4.28.9"
    adjust_installreferrer_version = "2.2"

    adjust = [
            android        : "com.adjust.sdk:adjust-android:${adjust_version}",
            webbridge      : "com.adjust.sdk:adjust-android-webbridge:${adjust_version}",
            installreferrer: "com.android.installreferrer:installreferrer:${adjust_installreferrer_version}"
    ]

    // Lottie
    lottie_version = "5.0.3"

    lottieDependency = [
            lottie: "com.airbnb.android:lottie-compose:$lottie_version"
    ]

    // Cognito
    cognito_version = "1.33.0"

    cognito = [
            core: "com.amplifyframework:core:$cognito_version",
            auth: "com.amplifyframework:aws-auth-cognito:$cognito_version"
    ]

    // Desugar
    desugar_version = "1.1.5"

    desugar = [
            jdk: "com.android.tools:desugar_jdk_libs:$desugar_version"
    ]

    // Togisoft
    togisoft_version = "1.1.2"

    togisoft = [
            country_code_picker: "com.github.togisoft:jetpack_compose_country_code_picker:$togisoft_version"
    ]

    // LibPhoneNumber
    libphonenumber_version = "8.12.46"

    libphonenumber = [
            libphonenumber: "com.googlecode.libphonenumber:libphonenumber:$libphonenumber_version"
    ]

    // Common Test
    junit_version = "4.13.2"
    ext_junit_version = "1.1.3"
    espresso_version = "3.4.0"
    robolectric_version = "4.6"
    mockito_core_version = "4.3.1"

    common_test = [
            junit       : "junit:junit:$junit_version",
            ext_junit   : "androidx.test.ext:junit:$ext_junit_version",
            espresso    : "androidx.test.espresso:espresso-core:$espresso_version",
            robolectric : "org.robolectric:robolectric:$robolectric_version",
            mockito_core: "org.mockito:mockito-core:$mockito_core_version"
    ]
}