buildscript {
    apply from: 'dependencies.gradle'
    repositories {
        maven  {
            url '../DexGuard-9.3.1/DexGuard-9.3.1/lib'          // For the DexGuard plugin.
        }
    }
    dependencies {
        classpath hilt.plugin
        classpath firebase.perf_classpath
        classpath firebase.crashlytics_classpath
        classpath google_services.plugin
        classpath 'com.guardsquare:dexguard-gradle-plugin:+'
    }
}// Top-level build file where you can add configuration options common to all sub-projects/modules.

plugins {
    id 'com.android.application' version '7.1.0' apply false
    id 'com.android.library' version '7.1.0' apply false
    id 'org.jetbrains.kotlin.android' version '1.5.31' apply false
}

task clean(type: Delete) {
    delete rootProject.buildDir
}

