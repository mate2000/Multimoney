mutation ResendMicroDepositVD(
    $identification: String!,
    $idCard: String!,
    $user: String!,
    $idBrand: Int!
)
{
    resendMicroDepositVD(
        resendMicroDepositVDInput: {
            identification: $identification,
            idCard: $idCard,
            user: $user,
            idBrand: $idBrand,
        }
    ) {
        status
        message
    }
}