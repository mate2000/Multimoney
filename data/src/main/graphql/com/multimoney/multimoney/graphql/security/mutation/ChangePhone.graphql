mutation ChangePhone($identification:String!, $phone:String!,$countryCode:String! $pkUser:Long!, $idBrand:Int!,$user:String!){
    changePhone(
        changePhoneInputType: {
            identification: $identification,
            phone:  $phone,
            countryCode: $countryCode,
            pkUser: $pkUser,
            idBrand: $idBrand,
            user: $user
        }
    ) {
        status
    }
}