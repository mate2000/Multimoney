query EmissionPlace(
    $pkUser: Int!,
    $idUserRequest: Int!,
    $idBrand: Int!,
    $user: String!
){
    emissionPlace(
        emissionPlaceInput: {
            pkUser: $pkUser,
            idUserRequest: $idUserRequest,
            idBrand: $idBrand,
            user: $user
        }
    ) {
        pk_Suv_Cat_Opcion_Pregunta_Solicitud_Credito
        fk_Suv_Cat_Pregunta_Solicitud_Credito
        fk_Suv_Cat_Opcion_Pregunta_Solicitud_Credito
        tipo_Control
        descripcion
        es_Catalogo_Core
        pk_Identificador_Catalogo
        es_Catalogo_Sucursal
        utiliza_Valor
        valor_Catalogo
        llave_Formulario
        monto_Maximo
        subOpciones {
            tipo_Control
            descripcion
            pk_Identificador_Catalogo
            utiliza_Valor
            valor_Catalogo
            fk_Identificador_Catalogo
            interno
            valor
        }
        fk_Identificador_Catalogo
        grupo
        evento
        interno
        valor
    }
}