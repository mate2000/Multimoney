query CreditOffer($pkUser: Long!,$idBrand: Int!){
    creditOffer(creditOfferInput: { pkUser: $pkUser, idBrand: $idBrand }) {
        idUserRequest
        products {
            iD_PRODUCTO
            lIMITE_CREDITO
            tRACTO
            mINIMO_DESEMBOLSO
            mAXIMO_DESEMBOLSO
            pLAZO
            mONEDA
            tASA_INTERES_NORMAL
            sTR_TASA_INTERES_NORMAL
            cUOTA
            cOMISION_DESEMBOLSO
            sTR_COMISION_DESEMBOLSO
            fECHA_PAGO
            nOMBRE_MONEDA
            sTR_MINIMO_DESEMBOLSO
            sTR_MAXIMO_DESEMBOLSO
            mensaje_Condiciones
            nombre_Usuario
            cuota_Real
            pLAZO_NUMERICO
            bIT_REQUIERE_FORMALIZACION
        }
    }
}