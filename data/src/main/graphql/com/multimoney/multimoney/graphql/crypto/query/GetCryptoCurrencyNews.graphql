query GetCryptoCurrencyNews(
    $baseAsset: String!,
    $user: String!,
    $idBrand: Int!
){
    cryptoNewsFeed(cryptoNewsFeedInput: {
        baseAsset: $baseAsset
        user: $user
        idBrand: $idBrand
    }
    ) {
        title,
        information,
        result{
            title,
            link
        }
    }
}