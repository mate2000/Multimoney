query GetCoreBankMovements(
    $user: String!,
    $idBrand: Int!,
    $identificationNumber: String!,
    $accountToken: Long!,
    $pageNumber: Int!,
    $pageSize: Int!,
    $monthDate: DateTime!
){
    getCoreBankMovements(
        getCoreBankMovementsInput: {
            user: $user,
            idBrand: $idBrand,
            identificationNumber: $identificationNumber,
            accountToken: $accountToken,
            pageNumber: $pageNumber,
            pageSize: $pageSize,
            monthDate: $monthDate
        }
    ) {
        totalRecords
        result {
            idTransaction
            creationDate
            transactionCatalogueDescription
            amount
            currencyDescription
            bankAuthorization
            idSubTransaction
            sign
        }
    }
}