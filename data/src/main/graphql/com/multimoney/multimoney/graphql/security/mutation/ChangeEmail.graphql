mutation ChangeEmail($pkUser:Long!,$identification:String!, $email:String!,$registerId:Int!,$changeUser:Boolean!,$idBrand:Int!,$user:String!){
    changeEmail(
        changeEmailInputType: {
            idClient: $pkUser
            identification: $identification,
            email: $email,
            registerId: $registerId,
            changeUser: $changeUser
            user: $user,
            idBrand: $idBrand
        }
    ) {
        status
    }
}