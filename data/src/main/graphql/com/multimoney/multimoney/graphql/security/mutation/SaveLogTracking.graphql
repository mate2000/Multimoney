mutation SaveLogTracking($identification: String, $pkUser: Int, $keySearch: String!, $data: String!, $idBrand: Int) {
    saveLogTracking(
        saveLogTrackingInputType: {
            identification: $identification
            pkUser : $pkUser
            keySearch: $keySearch
            data: $data
            idBrand: $idBrand
        }
    ){
        status
        message
        detail
    }
}