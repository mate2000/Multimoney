mutation SaveCreditFlowInput($user:String!, $idBrand:Int!, $infoQuestion:[questionsDataInput!]!, $idLogUserRequest:Int!, $idUser:Int!, $currentStep:String!){
  saveCreditFlowStep(
    saveCreditFlowStepInput: {
      user: $user
      idBrand: $idBrand
      infoQuestion: $infoQuestion
      idLogUserRequest: $idLogUserRequest
      idUser: $idUser
      currentStep: $currentStep
    }
  ) {
    messageInfo
    status
    result
  }
}
