mutation ACHTransferFavoriteDelete(
    $user: String!
    $idBrand: Int!
    $accountForAchTransferId: Int!
) {
    aCHTransferFavoriteDelete(
        aCHTransferFavoriteDeleteInput: { user: $user,
            idBrand: $idBrand,
            accountForAchTransferId: $accountForAchTransferId
        }
    ) {
        result {
            accountForAchTransferId
            accountNumber
            description
            titularName
            notificationEmail
            identificacionNumber
            isFavorite
            typeAccountId
            destinationBankId
            typeAccountDescription
            destinationBankDescription
            status
            destinationIdentificationBank
            transferState
            accountTypeCode
            aCHTypeAccountCode
            aCHPurposeType
            aPIACHAccountCode
            identificationNumberAccount
            identificationTypeAccount
            destinationAccountCurrencyId
            destinationAccountCurrency
        }
    }
}