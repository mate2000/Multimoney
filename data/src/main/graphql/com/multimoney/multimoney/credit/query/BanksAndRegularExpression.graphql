query BanksAndRegularExpression($pkUser:Int!, $user:String!, $idBrand:Int!, $idUserRequest:String!){
  banks(
    banksInput: {
      pkUser: $pkUser
      user: $user
      idBrand: $idBrand
      idUserRequest: $idUserRequest
    }
  ) {
      pk_Suv_Cat_Opcion_Pregunta_Solicitud_Credito
        fk_Suv_Cat_Pregunta_Solicitud_Credito
        tipo_Control
        descripcion
        es_Catalogo_Core
        pk_Identificador_Catalogo
        es_Catalogo_Sucursal
        utiliza_Valor
        valor_Catalogo
        llave_Formulario
        monto_Maximo
        subOpciones {
            descripcion
            pk_Identificador_Catalogo
            fk_Identificador_Catalogo
        }
        fk_Identificador_Catalogo
        valor
    }
  regularExpression(regularExpressionInput: { user: $user, idBrand: $idBrand }) {
    iNT_PK_VEN_CAT_EXPRESION_REGULAR
    sTR_LLAVE_04
    sTR_DESCRIPCION
    sTR_PATRON_EXPRESION
    iNT_FK_LLAVE_FORANEA
    iNT_ID_TIPO_CUENTA_DESEMBOLSO
  }
}
