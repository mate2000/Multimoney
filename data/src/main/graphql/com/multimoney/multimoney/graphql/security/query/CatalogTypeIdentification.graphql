query CatalogTypeIndentification($user:String!, $idBrand:Int!, $isTransferIdentification: Int){
    catalogTypeIndentification(
        catalogTypeIndentificationInput: {
            user: $user,
            idBrand: $idBrand,
            isTransferIdentifaction: $isTransferIdentification
        }
    ) {
        pk_Suv_Cat_Catalogo,
        descripcion,
        formato,
        valor
    }
}