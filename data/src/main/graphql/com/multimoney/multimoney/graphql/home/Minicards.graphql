query ListMiniCards(
    $infoCreditStatus:Boolean!,
    $infoVirtualCardStatus:Boolean!,
    $infoBankAccountStatus:Boolean!,
    $infoCripto:Boolean!,
    $userEmail:String!,
    $idBrand:Int!
)
{
    minicards(
        minicardsInput: {
            infoCreditStatus: $infoCreditStatus
            infoVirtualCardStatus: $infoVirtualCardStatus
            infoBankAccountStatus: $infoBankAccountStatus
            infoCripto: $infoCripto
            user: $userEmail
            idBrand: $idBrand
        }
    ) {
        prioridad
        tipo
        imagenUrl
        deeplink
    }
}