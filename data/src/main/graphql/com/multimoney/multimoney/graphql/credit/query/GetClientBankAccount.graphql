query GetClientBankAccount($user: String!, $idBrand: Int!, $idClient: Long!, $idLoanClient: Long!, $process: String!){
    getClientBankAccount(
        getClientBankAccountInput: {
            user: $user
            idBrand: $idBrand
            idClient: $idClient
            idLoanClient: $idLoanClient,
            process: $process
        }
    ) {
        id
        id_Banco
        origen
        descripcion_banco
        numeroCuenta
        id_Moneda
        id_Moneda_Destino
    }
}