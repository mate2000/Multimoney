query Balance(
    $user: String!,
    $identification: String!,
    $idBrand: Int!,
    $idClient: Long!,
    $idLoanClient: Int!,
    $creditStatus: Int!,
    $accountStatus: Int!,
    $cryptoStatus: Int!,
    $cardStatus: Int!
){
    balanceCredit(
        balanceCreditInput: {
            idBrand: $idBrand
            idClient: $idClient
            status: $creditStatus
        }
    ) {
        pagare
        resumen {
            id_Moneda
            moneda
            saldo_Actual
            saldo_Actual_Label
            saldo_Disponible
            saldo_Disponible_Label
            pago_Minimo
            fec_Pago
            pago_Minimo_Label
            fecha_Pago_Label
            cuota_Mensual
            cuota_Mensual_Label
            dias_Vencidos
            pagos_Vencidos
            cuenta_Iban
            saldo_Monto_Cancelar
            dias_Vencidos
            estado_Ampli
            producto_Activo
            aplica_Debito_Aut
            debito_Aut_Activo
            vDDebito_Aut_Activo
        }
        limite_credito
        limite_credito_label
        plazo
    }
    balanceAccountSmart(
        checkAccountInput:{
            identification : $identification
            status: $accountStatus
            user: $user
            idBrand: $idBrand
        }
    ) {
        accounts {
            currencyCode
            totalBalance
            gainedInterest
            tokenNumber
        }
        request {
            statusFirm
            statusOnfido
            idRequestSysde
            idRequestGlobal
        }
    }
    balanceCryptoAccount(
        balanceCryptoInput: {
            identification: $identification
            status: $cryptoStatus
            idBrand: $idBrand
            user: $user
        }
    ) {
        globalBalance
    }
    balanceCardInformation(
        balanceCardInformationInput: {
            idClient: $idClient
            identification: $identification
            idLoanClient: $idLoanClient
            user: $user
            idBrand: $idBrand
            status: $cardStatus
        }
    ) {
        cardInfo {
            cardNumber
        }
        eSTADO
    }
}