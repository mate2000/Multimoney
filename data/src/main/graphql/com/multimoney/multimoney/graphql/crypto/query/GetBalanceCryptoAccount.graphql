query GetBalanceCryptoAccount(
    $user: String!,
    $idBrand: Int!,
    $identification: String!,
    $status: Int!,
)
{
    balanceCryptoAccount(balanceCryptoInput: {
        user:$user,
        idBrand:$idBrand,
        identification:$identification,
        status:$status
    }) {
        globalBalance,
        investedBalance,
        percentageInvested,
        items {
            asset,
            available,
            trading,
            descriptionCurrency,
            balanceDollars,
            investedBalanceCurrency,
            percentageInvestedCurrency,
            priceOfTheDay,
            url_image,
        }
    }
}
