query DataInformationClient($identification:String!, $idBrand:Int!, $user:String!){
  dataInformationClient(
    dataInformationClientInput: {
      identification: $identification
      idBrand: $idBrand
      user: $user
    }
  ) {
    nombre
    nombre1
    nombre2
    apellido1
    apellido2
    status
    message
  }
}