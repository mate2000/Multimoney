    monto_Maximo
    subOpciones {
      pk_Suv_Cat_Opcion_Pregunta_Solicitud_Credito
      tipo_Control
      descripcion
      pk_Identificador_Catalogo
      utiliza_Valor
      valor_Catalogo
      fk_Identificador_Catalogo
      interno
      valor
    }
    fk_Identificador_Catalogo
    grupo
    evento
    interno
    valor
  }
  homeDistrict(homeDistrictInput: {  pkUser: $pkUser, user: $user, idBrand: $idBrand }) {
