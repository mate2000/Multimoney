plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
    id 'dagger.hilt.android.plugin'
    id 'kotlin-kapt'
    id("com.apollographql.apollo3").version("3.1.0")
    id  'dexguard'
}

apply from: '../dependencies.gradle'

android {
    compileSdk compile_sdk_version

    defaultConfig {
        minSdk min_sdk_version
        targetSdk target_sdk_version

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles "consumer-rules.pro"
    }

    buildTypes {
        production {
            minifyEnabled false
            shrinkResources false
//            minifyEnabled false
//            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            buildConfigField "String", "API_URL", System.env.PRODUCTION_API_URL ? "\"${System.env.PRODUCTION_API_URL}\"" : apiUrl
        }
        staging {
            testCoverageEnabled true
            buildConfigField "String", "API_URL", System.env.STAGING_API_URL ? "\"${System.env.STAGING_API_URL}\"" : apiUrl
        }
        debug {
            testCoverageEnabled true
            buildConfigField "String", "API_URL", System.env.DEVELOPMENT_API_URL ? "\"${System.env.DEVELOPMENT_API_URL}\"" : apiUrl
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }

    dexOptions {
        incremental = true;
        preDexLibraries = false
        javaMaxHeapSize "4g" // 2g should be also OK
    }
}

apollo {
    packageName.set("com.multimoney.data.networking.apollomodel")
}

dependencies {

    implementation project(path: ':domain')

    // Room
    implementation room.runtime
    kapt room.compiler
    implementation room.ktx
    testImplementation room.testing

    // Hilt
    implementation hilt.android
    kapt hilt.compiler

    // Coroutines
    implementation coroutines.android

    // Apollo
    implementation apollo.runtime
    implementation apollo.cache
    implementation apollo.cache_sqlite

    // OkHttp3
    implementation okhttp3.interceptor

    // Common Test
    testImplementation common_test.junit
    androidTestImplementation common_test.ext_junit
    androidTestImplementation common_test.espresso
    testImplementation common_test.robolectric
    testImplementation common_test.mockito_core
}

dexguard {
    path = '../../DexGuard-9.3.1/DexGuard-9.3.1'
    // We can build the sample with the sample license file
    license = '../../DexGuard-9.3.1/DexGuard-9.3.1/lib/dexguard-license.txt'
    configurations {
        debug {
            defaultConfiguration 'dexguard-debug.pro'
            configuration 'dexguard-project.txt'
            configuration 'proguard-project.txt'
        }
        release {
            defaultConfiguration 'dexguard-release-aggressive.pro'
            configuration 'dexguard-project.txt'
            configuration 'proguard-project.txt'
        }
    }
}