mutation ChangePhone($identification:String!, $phone:String!, $pkUser:Long!, $idBrand:Int!,$user:String!){
    changePhone(
        changePhoneInputType: {
            identification: $identification,
            phone:  $phone,
            pkUser: $pkUser,
            idBrand: $idBrand,
            user: $user
        }
    ) {
        status
    }
}