buildscript {
    apply from: 'dependencies.gradle'
    repositories {
        maven  {
           //url '../DexGuard-9.3.1/DexGuard-9.3.1/lib'          // For the DexGuard plugin.
            credentials  {
//                username = "${DEXGUARD_USERNAME}"
//                password = "${DEXGUARD_PASSWORD}"
                                username = "maven"
                password = "QaJpWH8yL97x5SzpZ3LFRLoiIrZajBDTCIFirSuqExeQDC88slgpYVsbHZQR5aCPMPUVlPw7RTi0K23qC2d3FhbLZnrTNS2G9LJN0GdiOOs7IDF59dezBlcYpq19XvJK"
            }
            url "https://maven.guardsquare.com"
            // Only search for artifacts with groupId "com.guardsquare.*",
            // supported since gradle 5.1.
            content {
                includeGroupByRegex "com\\.guardsquare.*"
            }
            authentication {
                basic(BasicAuthentication)
            }
        }
    }
    dependencies {
        classpath hilt.plugin
        classpath firebase.perf_classpath
        classpath firebase.crashlytics_classpath
        classpath google_services.plugin
        classpath 'com.guardsquare:dexguard-gradle-plugin:+'
    }
}// Top-level build file where you can add configuration options common to all sub-projects/modules.

plugins {
    id 'com.android.application' version '7.1.0' apply false
    id 'com.android.library' version '7.1.0' apply false
    id 'org.jetbrains.kotlin.android' version '1.5.31' apply false
}

task clean(type: Delete) {
    delete rootProject.buildDir
}

