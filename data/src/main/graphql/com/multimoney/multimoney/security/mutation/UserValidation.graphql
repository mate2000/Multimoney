mutation UserValidation($email: String!, $currentStep: String!,$idBrand: Int!){
    userValidation(
        userValidationInput: { email: $email, currentStep: $currentStep, idBrand: $idBrand}
    ) {
        pkUser
        userName
        email
        phoneNumber
        fullName
        firstName
        secondName
        lastName
        secondLastName
        nationality
        identification
        countryCode
        currentStep
        userStatus
    }
}
