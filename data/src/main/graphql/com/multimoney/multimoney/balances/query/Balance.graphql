query Balance($user:String!,$identification:String!,$idBrand:Int!,$idClient:Int!,$idLoanClient:Int!, $creditStatus:Int!, $accountStatus:Int!, $cryptoStatus:Int!, $cardStatus:Int!){
    balanceCredit(
        balanceCreditInput: {
            idBrand: $idBrand
            idClient: $idClient
            status: $creditStatus
        }
    ) {
        resumen {
            id_Moneda
            moneda
            saldo_Actual
            saldo_Actual_Label
            saldo_Disponible
            saldo_Disponible_Label
            fecha_Pago_Label
            cuota_Mensual
            cuota_Mensual_Label
            saldo_Monto_Cancelar
        }
    }
    balanceAccountSmart(
        checkAccountInput:{
            identification : $identification
            status: $accountStatus
            user: $user
            idBrand: $idBrand
        }
    ) {
        accounts {
            totalBalance
            gainedInterest
        }
        request {
            statusFirm
            statusOnfido
            idRequestSysde
            idRequestGlobal}
    }
    balanceCryptoAccount(
        balanceCryptoInput: {
            identification: $identification
            status: $cryptoStatus
            idBrand: $idBrand
            user: $user
        }
    ) {
        globalBalance
    }
    balanceCardInformation(
        balanceCardInformationInput: {
            idClient: $idClient
            identification: $identification
            idLoanClient: $idLoanClient
            user: $user
            idBrand: $idBrand
            status: $cardStatus
        }
    ) {
        cardInfo {
            cardNumber
        }
        eSTADO
    }
}